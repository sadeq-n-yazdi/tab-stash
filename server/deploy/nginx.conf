# nginx site for tab-stash-server. Change the host name and the certificate
# paths. Get a certificate first, for example with certbot:
#   certbot certonly --nginx -d tabs.example.com
server {
    listen 80;
    listen [::]:80;
    server_name tabs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tabs.example.com;

    ssl_certificate     /etc/letsencrypt/live/tabs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabs.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The server does not send HSTS behind a proxy. The proxy sends it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A sync request can have 500 records.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # The server reads the client address from this header
        # (TAB_STASH_CLIENT_IP_HEADER=X-Real-IP).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
