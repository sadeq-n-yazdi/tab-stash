<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Shelf</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="../lib/base.css">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header class="topbar">
    <h1><img src="../icons/icon-32.png" alt="" width="22" height="22"> Tab Shelf</h1>
    <input type="search" id="search" placeholder="Search title, URL, note, label…  ( / )" aria-label="Search">
    <div class="top-actions">
      <button type="button" id="new-group">＋ New group</button>
      <button type="button" id="import-btn">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button type="button" id="export-btn">Export</button>
      <button type="button" id="settings-btn" title="Settings">⚙ Settings</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="Groups">
        <h2>Groups</h2>
        <ul id="group-list" class="group-list"></ul>
      </nav>
      <section>
        <h2>Labels</h2>
        <div id="label-filter" class="label-filter"></div>
      </section>
      <section>
        <h2>Colours</h2>
        <div id="color-filter" class="color-filter"></div>
      </section>
      <section class="shortcuts">
        <h2>Shortcuts</h2>
        <ul id="shortcut-list"></ul>
        <button type="button" class="small" id="edit-shortcuts">Change shortcuts</button>
      </section>
    </aside>

    <main>
      <section id="group-header" class="group-header"></section>
      <div id="bulk-bar" class="bulk-bar" hidden></div>
      <p id="status" class="status" role="status"></p>
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <p id="empty" class="empty" hidden></p>
    </main>
  </div>

  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog"></form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog" class="confirm">
      <p id="confirm-text"></p>
      <menu>
        <button value="cancel" autofocus>Cancel</button>
        <button value="ok" class="primary danger-fill" id="confirm-ok">Delete</button>
      </menu>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form" class="dialog-form">
      <h2>Settings</h2>
      <label class="check"><input type="checkbox" name="closeAfterSave"> Close tabs after saving them</label>
      <label class="check"><input type="checkbox" name="skipPinned"> Do not save pinned tabs with "all tabs in window"</label>
      <label class="check"><input type="checkbox" name="restoreAsTabGroup"> Open a saved group as a Chrome tab group (same name and colour)</label>
      <label class="check"><input type="checkbox" name="removeOnRestore"> Remove bookmarks after "Open all" (same as "Restore all")</label>
      <menu>
        <button value="cancel">Cancel</button>
        <button value="save" class="primary">Save</button>
      </menu>
    </form>
  </dialog>

  <datalist id="label-list"></datalist>
  <script type="module" src="manager.js"></script>
</body>
</html>
